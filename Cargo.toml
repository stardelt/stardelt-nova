[workspace]
resolver = "2"
members = ["backend"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
kube = { version = "4.2", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
# OIDC (auth.rs). jsonwebtoken 9 verifies with `ring`, which rustls already brings in.
jsonwebtoken = { version = "9.3", default-features = false }
axum-extra = { version = "0.12", default-features = false, features = ["cookie-signed", "cookie-key-expansion"] }
base64 = "0.23"
getrandom = "0.4"
sha2 = "0.11"
url = "2"
# IANA time zones for a pipeline's schedule (stardelt-nova#210): a typo is a 400 sentence,
# not a pipeline the loader cannot schedule. MIT OR Apache-2.0.
chrono-tz = "0.10"
tower = { version = "0.5", features = ["util"] }
# Bounded concurrency for the connection listing (ticket #171): at most eight metadata
# reads in flight. MIT OR Apache-2.0.
futures = { version = "0.3", default-features = false, features = ["std"] }
# OpenAPI description of the public API (ticket #107). utoipa is MIT/Apache-2.0;
# annotations only — no new runtime behaviour beyond serving the document.
utoipa = { version = "5" }
# State store (ticket stardelt-nova#103): PostgreSQL through sqlx. MIT OR Apache-2.0.
# No `default` features: no sqlite/mysql drivers, no native-tls; rustls with `ring`
# (the provider reqwest already uses) and the bundled WebPKI roots.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "json"] }
