[workspace]
resolver = "2"
members = ["backend"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
kube = { version = "4.2", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
# OIDC (auth.rs). jsonwebtoken 9 verifies with `ring`, which rustls already brings in.
jsonwebtoken = { version = "11.1", default-features = false }
axum-extra = { version = "0.12", default-features = false, features = ["cookie-signed", "cookie-key-expansion"] }
base64 = "0.23"
getrandom = "0.4"
sha2 = "0.11"
url = "2"
percent-encoding = "2"
# IANA time zones for a pipeline's schedule (stardelt-nova#210): a typo is a 400 sentence,
# not a pipeline the loader cannot schedule. MIT OR Apache-2.0.
chrono-tz = "0.10"
# Local wall-clock times for the next-runs preview (stardelt-nova#223): the next fire times in
# the schedule's zone, across a DST change. Already in the tree through `chrono-tz`; no `clock`
# feature, because Nova reads the clock through `std` and never asks for the machine's zone.
# MIT OR Apache-2.0.
chrono = { version = "0.4", default-features = false, features = ["std"] }
tower = { version = "0.5", features = ["util"] }
# Bounded concurrency for the connection listing (ticket #171): at most eight metadata
# reads in flight. MIT OR Apache-2.0.
futures = { version = "0.3", default-features = false, features = ["std"] }
# OpenAPI description of the public API (ticket #107). utoipa is MIT/Apache-2.0;
# annotations only — no new runtime behaviour beyond serving the document.
utoipa = { version = "5" }
# Published notebooks (`notebooks.rs`): SigV4 presigning for S3 (BSD-2-Clause) and the
# XML parser it already depends on (Apache-2.0 OR MIT). `jiff` is rusty-s3's clock,
# needed to sign a `ListObjectVersions` request it has no action for.
rusty-s3 = { version = "0.10", default-features = false, features = ["rustcrypto", "xml"] }
instant-xml = "0.7"
jiff = "0.2"
# A header-signed `ListObjectVersions` (stardelt-nova#245): SeaweedFS refuses the
# presigned form of that one S3 action, so Nova signs the request headers itself. The
# same 0.13 build rusty-s3's `rustcrypto` signing already pulls in. MIT OR Apache-2.0.
hmac = "0.13"
# State store (ticket stardelt-nova#103): PostgreSQL through sqlx. MIT OR Apache-2.0.
# No `default` features: no sqlite/mysql drivers, no native-tls; rustls with `ring`
# (the provider reqwest already uses) and the bundled WebPKI roots.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "json"] }
