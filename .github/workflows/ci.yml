name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: fmt check
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: check
        run: cargo check --all-targets

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        # No package-lock.json is committed (the image build uses `npm install`
        # too), so `npm ci` / the setup-node npm cache can't be used here.
        run: npm install

      - name: TypeScript type-check
        run: npx tsc -b --noEmit

      - name: Build
        run: npm run build

  image:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Only run on pushes to main / dev (not on PRs).
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Moving tag for the branch
        id: tag
        # main → :latest, dev → :dev
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "moving=ghcr.io/stardelt/nova:latest" >> "$GITHUB_OUTPUT"
          else
            echo "moving=ghcr.io/stardelt/nova:dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: image/Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.moving }}
            ghcr.io/stardelt/nova:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
