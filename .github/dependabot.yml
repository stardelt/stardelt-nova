version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Minor and patch together (they are routine and safe as a unit).
      # Majors are deliberately NOT grouped: a framework major riding along with
      # six small bumps is how a build breaks in a PR nobody can review.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
